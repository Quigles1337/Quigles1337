<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="t d"><title id="t">The Token</title><desc id="d">A ring in two arms, gold on the left and violet on the right, open at a gate at the bottom and joined by a clasp at the top. Inside runs a rail of 57 places, every third one dotted. A gold line walks from the gate round the dotted places, three at a time. A second line leaves the gate for another place and from there a violet star strides twenty-one places at a time. The two lines end on the same place, where a bead sits half gold and half violet. At the centre a small light burns. Counting places clockwise from the gate: the gold line takes nine steps, the second line goes to place thirty-six, the star takes five strides, and both end on place twenty-seven.</desc><style>.rm0{animation:rm0 16s linear infinite both}@keyframes rm0{0%{stroke-dashoffset:94.15;opacity:0}8.875%{stroke-dashoffset:94.15;opacity:0}9%{stroke-dashoffset:94.15;opacity:1;animation-timing-function:cubic-bezier(.3,0,.2,1)}12.5%{stroke-dashoffset:0;opacity:1}75%{stroke-dashoffset:0;opacity:1}80.625%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:94.15;opacity:0} }.rm1{animation:rm1 16s linear infinite both}@keyframes rm1{0%{stroke-dashoffset:94.15;opacity:0}12.75%{stroke-dashoffset:94.15;opacity:0}12.875%{stroke-dashoffset:94.15;opacity:1;animation-timing-function:cubic-bezier(.3,0,.2,1)}16.375%{stroke-dashoffset:0;opacity:1}75%{stroke-dashoffset:0;opacity:1}80.625%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:94.15;opacity:0} }.rm2{animation:rm2 16s linear infinite both}@keyframes rm2{0%{stroke-dashoffset:94.15;opacity:0}16.625%{stroke-dashoffset:94.15;opacity:0}16.75%{stroke-dashoffset:94.15;opacity:1;animation-timing-function:cubic-bezier(.3,0,.2,1)}20.25%{stroke-dashoffset:0;opacity:1}75%{stroke-dashoffset:0;opacity:1}80.625%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:94.15;opacity:0} }.rm3{animation:rm3 1